<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="522" viewBox="0 0 1100 522" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>An agent with the ctxtra skill shows the ctxtra binding add command and runs it after you say yes, then explains why a session didn&#x27;t get a skill</title>
<rect x="0.5" y="0.5" width="1099" height="521" rx="14" fill="#0B0F17" stroke="#243045"/>

<rect x="1" y="1" width="1098" height="44" rx="13" fill="#121926"/>
<rect x="1" y="30" width="1098" height="15" fill="#121926"/>
<line x1="1" y1="45" x2="1099" y2="45" stroke="#243045"/>
<circle cx="26" cy="23" r="6.5" fill="#FF5F57"/>
<circle cx="48" cy="23" r="6.5" fill="#FEBC2E"/>
<circle cx="70" cy="23" r="6.5" fill="#28C840"/>
<text x="550.0" y="28" font-size="14" fill="#9AA6B8" text-anchor="middle">your agent, with the ctxtra skill</text>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0353;0.0500;0.9471;0.9824;1.0000" dur="17.0s" repeatCount="indefinite"/><rect x="756" y="70" width="304" height="42" rx="12" fill="#A78BFA" fill-opacity="0.14" stroke="#A78BFA" stroke-opacity="0.5"/><text x="772" y="96" font-size="15" fill="#E6EDF3">Add my Go notes to every acme repo</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0824;0.0829;0.1412;0.1418;1.0000" dur="17.0s" repeatCount="indefinite"/><rect x="96" y="124" width="64" height="42" rx="12" fill="#121926" stroke="#243045"/><circle cx="114" cy="145" r="3.5" fill="#9AA6B8"/><circle cx="128" cy="145" r="3.5" fill="#9AA6B8"/><circle cx="142" cy="145" r="3.5" fill="#9AA6B8"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1412;0.1559;0.9471;0.9824;1.0000" dur="17.0s" repeatCount="indefinite"/><rect x="40" y="124" width="40" height="40" rx="10" fill="none" stroke="#E6EDF3" stroke-width="2"/><text x="60" y="150" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#E6EDF3" text-anchor="middle">&gt;_</text><rect x="96" y="124" width="745.2" height="74" rx="12" fill="#121926" stroke="#243045"/><text x="112" y="150" font-size="15" fill="#E6EDF3">I&#x27;ll add this binding. OK to run it?</text><rect x="108" y="159" width="721.2" height="26" rx="6" fill="#0B0F17" stroke="#243045"/><text x="118" y="177" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#22D3EE" xml:space="preserve">ctxtra binding add go --repo &#x27;github.com/acme/**&#x27; --instruction ~/notes/go-style.md</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2706;0.2853;0.9471;0.9824;1.0000" dur="17.0s" repeatCount="indefinite"/><rect x="1004" y="210" width="56" height="42" rx="12" fill="#A78BFA" fill-opacity="0.14" stroke="#A78BFA" stroke-opacity="0.5"/><text x="1020" y="236" font-size="15" fill="#E6EDF3">Yes</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2824;0.2829;0.3412;0.3418;1.0000" dur="17.0s" repeatCount="indefinite"/><rect x="96" y="264" width="64" height="42" rx="12" fill="#121926" stroke="#243045"/><circle cx="114" cy="285" r="3.5" fill="#9AA6B8"/><circle cx="128" cy="285" r="3.5" fill="#9AA6B8"/><circle cx="142" cy="285" r="3.5" fill="#9AA6B8"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3412;0.3559;0.9471;0.9824;1.0000" dur="17.0s" repeatCount="indefinite"/><rect x="40" y="264" width="40" height="40" rx="10" fill="none" stroke="#E6EDF3" stroke-width="2"/><text x="60" y="290" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#E6EDF3" text-anchor="middle">&gt;_</text><rect x="96" y="264" width="568" height="42" rx="12" fill="#121926" stroke="#243045"/><text x="112" y="290" font-size="15" fill="#4ADE80">✓ Done. New sessions in acme repos get go-style.md, in every agent.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4824;0.4971;0.9471;0.9824;1.0000" dur="17.0s" repeatCount="indefinite"/><rect x="620" y="318" width="440" height="42" rx="12" fill="#A78BFA" fill-opacity="0.14" stroke="#A78BFA" stroke-opacity="0.5"/><text x="636" y="344" font-size="15" fill="#E6EDF3">Why didn&#x27;t my billing session get the deploy skill?</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5529;0.5535;0.6118;0.6124;1.0000" dur="17.0s" repeatCount="indefinite"/><rect x="96" y="372" width="64" height="42" rx="12" fill="#121926" stroke="#243045"/><circle cx="114" cy="393" r="3.5" fill="#9AA6B8"/><circle cx="128" cy="393" r="3.5" fill="#9AA6B8"/><circle cx="142" cy="393" r="3.5" fill="#9AA6B8"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6118;0.6265;0.9471;0.9824;1.0000" dur="17.0s" repeatCount="indefinite"/><rect x="40" y="372" width="40" height="40" rx="10" fill="none" stroke="#E6EDF3" stroke-width="2"/><text x="60" y="398" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#E6EDF3" text-anchor="middle">&gt;_</text><rect x="96" y="372" width="600" height="118" rx="12" fill="#121926" stroke="#243045"/><text x="112" y="398" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#6B778A">ran ctxtra context explain ~/dev/acme/billing</text><text x="112" y="420" font-size="15" fill="#E6EDF3">Your team repo is pinned to a1b2c3d, and deploy came in a later commit.</text><text x="112" y="442" font-size="15" fill="#E6EDF3">To review that commit and accept it, run in your terminal:</text><rect x="108" y="451" width="576" height="26" rx="6" fill="#0B0F17" stroke="#243045"/><text x="118" y="469" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#22D3EE" xml:space="preserve">ctxtra source update</text></g>
</svg>
