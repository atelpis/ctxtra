<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Where agent instructions live: out of the box each agent reads its own files, global or committed; generator tools write generated files into every project; ctxtra injects them at runtime and writes nothing into your projects</title>
<rect x="0.5" y="0.5" width="1279" height="639" rx="18" fill="#0B0F17" stroke="#243045"/>

<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#A78BFA"/><stop offset="0.5" stop-color="#22D3EE"/><stop offset="1" stop-color="#A3E635"/></linearGradient></defs>
<text x="40" y="58" font-size="15" font-weight="700" letter-spacing="2" fill="#22D3EE">WHERE YOUR AGENT INSTRUCTIONS LIVE</text>
<text x="40" y="92" font-size="25" font-weight="600" fill="#E6EDF3">Out of the box, with a generator, and with ctxtra</text>
<rect x="40" y="122" width="384" height="486" rx="14" fill="#121926" stroke="#243045" stroke-width="1"/>
<text x="62" y="162" font-size="21" font-weight="700" fill="#E6EDF3">Agent out of the box</text>
<text x="62" y="186" font-size="15" fill="#9AA6B8">each agent reads its own files</text>
<text x="62" y="226" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#E6EDF3" xml:space="preserve">~/.claude/CLAUDE.md</text>
<text x="402" y="226" font-size="14" fill="#6B778A" text-anchor="end">every repo</text>
<text x="62" y="254" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#E6EDF3" xml:space="preserve">~/.codex/AGENTS.md</text>
<text x="402" y="254" font-size="14" fill="#6B778A" text-anchor="end">every repo</text>
<text x="62" y="282" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#E6EDF3" xml:space="preserve">~/dev/AGENTS.md</text>
<text x="402" y="282" font-size="14" fill="#6B778A" text-anchor="end">parent folder</text>
<text x="62" y="310" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#E6EDF3" xml:space="preserve">~/dev/shop-api/</text>
<text x="62" y="338" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#E6EDF3" xml:space="preserve">  AGENTS.md</text>
<text x="402" y="338" font-size="14" fill="#FBBF24" text-anchor="end">in the repo</text>
<text x="62" y="366" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#E6EDF3" xml:space="preserve">  api/AGENTS.md</text>
<text x="402" y="366" font-size="14" fill="#FBBF24" text-anchor="end">in the repo</text>
<line x1="62" y1="416" x2="402" y2="416" stroke="#243045"/>
<text x="62" y="450" font-size="17" font-weight="700" fill="#F87171">✕</text>
<text x="86" y="450" font-size="16" fill="#E6EDF3">Different files and places per agent</text>
<text x="62" y="480" font-size="17" font-weight="700" fill="#F87171">✕</text>
<text x="86" y="480" font-size="16" fill="#E6EDF3">Personal notes: global, or in the project</text>
<text x="62" y="510" font-size="17" font-weight="700" fill="#F87171">✕</text>
<text x="86" y="510" font-size="16" fill="#E6EDF3">Scoped by folder, not by repo identity</text>
<rect x="448" y="122" width="384" height="486" rx="14" fill="#121926" stroke="#243045" stroke-width="1"/>
<text x="470" y="162" font-size="21" font-weight="700" fill="#E6EDF3">Generator tools</text>
<text x="470" y="186" font-size="15" fill="#9AA6B8">one source, generated into each agent&#x27;s files</text>
<text x="470" y="226" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#E6EDF3" xml:space="preserve">~/dev/shop-api/</text>
<text x="470" y="254" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#E6EDF3" xml:space="preserve">  .ruler/  .rulesync/</text>
<text x="810" y="254" font-size="14" fill="#6B778A" text-anchor="end">source</text>
<text x="470" y="282" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#E6EDF3" xml:space="preserve">  AGENTS.md</text>
<text x="810" y="282" font-size="14" fill="#FBBF24" text-anchor="end">generated</text>
<text x="470" y="310" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#E6EDF3" xml:space="preserve">  CLAUDE.md</text>
<text x="810" y="310" font-size="14" fill="#FBBF24" text-anchor="end">generated</text>
<text x="470" y="338" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#E6EDF3" xml:space="preserve">  .cursor/rules/</text>
<text x="810" y="338" font-size="14" fill="#FBBF24" text-anchor="end">generated</text>
<text x="470" y="366" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#E6EDF3" xml:space="preserve">  .gitignore</text>
<text x="810" y="366" font-size="14" fill="#FBBF24" text-anchor="end">+ generated files</text>
<text x="470" y="394" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#E6EDF3" xml:space="preserve">~/.claude/  ~/.codex/</text>
<text x="810" y="394" font-size="14" fill="#6B778A" text-anchor="end">global mode</text>
<line x1="470" y1="416" x2="810" y2="416" stroke="#243045"/>
<text x="470" y="450" font-size="17" font-weight="700" fill="#4ADE80">✓</text>
<text x="494" y="450" font-size="16" fill="#E6EDF3">One source for many agents</text>
<text x="470" y="480" font-size="17" font-weight="700" fill="#F87171">✕</text>
<text x="494" y="480" font-size="16" fill="#E6EDF3">Writes generated files into projects</text>
<text x="470" y="510" font-size="17" font-weight="700" fill="#F87171">✕</text>
<text x="494" y="510" font-size="16" fill="#E6EDF3">Regenerate after each change, or watch</text>
<rect x="856" y="122" width="384" height="486" rx="14" fill="#121926" stroke="url(#g)" stroke-width="2.5"/>
<text x="878" y="162" font-size="21" font-weight="700" fill="#E6EDF3" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">ctxtra</text>
<text x="878" y="186" font-size="15" fill="#9AA6B8">injected into the session at runtime</text>
<text x="878" y="226" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#E6EDF3" xml:space="preserve">~/dev/shop-api/</text>
<text x="1218" y="226" font-size="14" fill="#4ADE80" text-anchor="end">nothing added</text>
<text x="878" y="254" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#E6EDF3" xml:space="preserve">  AGENTS.md</text>
<text x="1218" y="254" font-size="14" fill="#6B778A" text-anchor="end">the team&#x27;s, untouched</text>
<text x="878" y="282" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#E6EDF3" xml:space="preserve">~/dotfiles/</text>
<text x="1218" y="282" font-size="14" fill="#4ADE80" text-anchor="end">your package, live</text>
<text x="878" y="310" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#E6EDF3" xml:space="preserve">  go-style.md  review/</text>
<text x="878" y="338" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#E6EDF3" xml:space="preserve">your-org/team-ctx</text>
<text x="1218" y="338" font-size="14" fill="#22D3EE" text-anchor="end">shared, pinned</text>
<text x="878" y="366" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#E6EDF3" xml:space="preserve">  services.md  deploy/</text>
<line x1="878" y1="416" x2="1218" y2="416" stroke="#243045"/>
<text x="878" y="450" font-size="17" font-weight="700" fill="#4ADE80">✓</text>
<text x="902" y="450" font-size="16" fill="#E6EDF3">All supported agents, one config</text>
<text x="878" y="480" font-size="17" font-weight="700" fill="#4ADE80">✓</text>
<text x="902" y="480" font-size="16" fill="#E6EDF3">Nothing written into your projects</text>
<text x="878" y="510" font-size="17" font-weight="700" fill="#4ADE80">✓</text>
<text x="902" y="510" font-size="16" fill="#E6EDF3">Local files, or shared repos you review</text>
<text x="878" y="540" font-size="17" font-weight="700" fill="#4ADE80">✓</text>
<text x="902" y="540" font-size="16" fill="#E6EDF3">Target by folder, git remote or subpath</text>
<text x="878" y="570" font-size="17" font-weight="700" fill="#4ADE80">✓</text>
<text x="902" y="570" font-size="16" fill="#E6EDF3">Every worktree, automatically</text>
</svg>
