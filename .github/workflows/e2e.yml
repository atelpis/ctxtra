name: e2e

# Agent contract tests against the agent versions pinned in
# e2e/agents/package-lock.json, e2e/agents/muse.json and e2e/agents/hermes.ref.
# No secrets: the agents talk only to the mock.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Docs and images can't change what reaches an agent; the skills can
  # (TestCtxtraSkill). A change of only those skips the jobs below rather
  # than the workflow: a skipped job passes a required check, a workflow
  # that never ran leaves it pending.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      e2e: ${{ steps.check.outputs.e2e }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # One line per file, true when it needs e2e. jq classifies, so a
          # file name never reaches the shell. Old names count too: a skill
          # moved out of skills/ changes the binary.
          needs='.filename, (.previous_filename // empty)
            | startswith("skills/") or ((endswith(".md") or startswith("docs/assets/") or . == "LICENSE") | not)'
          out=
          if [ "$EVENT" = pull_request ]; then
            out=$(gh api --paginate "repos/$GH_REPO/pulls/$PR/files" --jq ".[] | $needs") || out=
          elif [ "$EVENT" = push ]; then
            out=$(gh api "repos/$GH_REPO/compare/$BEFORE...$AFTER" --jq ".files[] | $needs") || out=
          fi
          e2e=true
          # The APIs return at most 300 (compare) or 3000 files: a longer list may be cut.
          if [ -n "$out" ] && [ "$(printf '%s\n' "$out" | wc -l)" -lt 300 ] && ! grep -qv '^false$' <<<"$out"; then
            e2e=false
          fi
          echo "e2e=$e2e" | tee -a "$GITHUB_OUTPUT"

  linux:
    needs: changes
    # Runs when changes failed too: only a clear "false" skips e2e.
    if: ${{ !cancelled() && needs.changes.outputs.e2e != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -f e2e/Dockerfile -t ctxtra-e2e .
      # The container's user must be able to write the evidence folder.
      - run: mkdir -m 777 evidence
      - run: >-
          docker run --rm --network none
          -v "$PWD/evidence:/evidence" -e CTXTRA_E2E_EVIDENCE=/evidence
          ctxtra-e2e go test -count=1 -timeout 20m -v ./...
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-evidence-linux
          path: evidence

  macos:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.e2e != 'false' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Hermes needs Python 3.11 to 3.13.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: brew install tmux
      - run: e2e/agents/install.sh
      - working-directory: e2e
        env:
          CTXTRA_E2E_REQUIRE: "1"
          CTXTRA_E2E_EVIDENCE: ${{ github.workspace }}/evidence
        run: go test -count=1 -timeout 20m -v ./...
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-evidence-macos
          path: evidence
