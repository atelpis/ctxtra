name: release

# A v* tag publishes a GitHub release: the archives as a draft, their
# provenance attestations, then the release itself. A tag with a "-" (such as
# v0.2.0-rc.1) is a prerelease and leaves the Homebrew tap alone. RELEASING.md
# has the steps around it.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# With pipefail, unlike the default shell: a failed download must not be
# hashed.
defaults:
  run:
    shell: bash

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      # A release that changes what setup writes needs its own snapshot, which
      # the upgrade tests run (docs/spec.md, Setup compatibility).
      - name: Check the setup snapshot
        run: |
          latest=$(ls testdata/clients | sort -V | tail -n 1)
          if ! diff -r -x client.json internal/setup/testdata/contract "testdata/clients/$latest"; then
            echo "::error::setup writes something other than testdata/clients/$latest: add a snapshot for $TAG (RELEASING.md)"
            exit 1
          fi

      # A release candidate takes the notes of its version: v0.2.0-rc.1 those
      # of "## v0.2.0".
      - name: Take the release notes from CHANGELOG.md
        run: |
          version=${TAG%%-*}
          awk -v h="## $version" '$0 == h || index($0, h " ") == 1 { on = 1; next } on && /^## / { exit } on' CHANGELOG.md >"$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section \"## $version\""
            exit 1
          fi

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt

      - name: Verify an attestation
        run: |
          f=$(find dist -maxdepth 1 -name 'ctxtra_*_linux_amd64.tar.gz')
          gh attestation verify "$f" --repo "$GITHUB_REPOSITORY"

      - name: Publish the release
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  # Opens a PR in the tap; the tap's CI builds the bottles, and its publish
  # workflow, run by hand, adds them and closes the PR.
  homebrew:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      TAP: atelpis/homebrew-tap
      # A fine-grained token with contents and pull requests write access to
      # the tap repository only.
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Open a PR that bumps the formula
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::no HOMEBREW_TAP_TOKEN secret: update the tap by hand (RELEASING.md)"
            exit 0
          fi
          export GH_TOKEN="$TAP_TOKEN"
          url="https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$TAG.tar.gz"
          sha=$(curl -fsSL "$url" | sha256sum | cut -d ' ' -f 1)
          version=${TAG#v}
          gh repo clone "$TAP" tap -- --depth 1
          cd tap
          branch="ctxtra-$version"
          git checkout -b "$branch"
          sed -i -E \
            -e "s|^  url \".*\"$|  url \"$url\"|" \
            -e "s|^  sha256 \".*\"$|  sha256 \"$sha\"|" \
            Formula/ctxtra.rb
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -am "ctxtra $version"
          git push "https://x-access-token:$TAP_TOKEN@github.com/$TAP.git" "$branch"
          gh pr create --repo "$TAP" --head "$branch" --title "ctxtra $version" \
            --body "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
