name: fuzz

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "53 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: config
            target: FuzzConfig
          - package: config
            target: FuzzSourceReference
          - package: source
            target: FuzzStorePath
          - package: hook
            target: FuzzInvalidInput
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Fuzz
        env:
          PACKAGE: ${{ matrix.package }}
          TARGET: ${{ matrix.target }}
          DURATION: ${{ github.event_name == 'schedule' && '2m' || '10s' }}
        run: go test "./internal/$PACKAGE" -run '^$' -fuzz "^$TARGET$" -fuzztime "$DURATION" -parallel 2
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}
          path: internal/${{ matrix.package }}/testdata/fuzz/
